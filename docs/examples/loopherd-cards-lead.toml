# Append to ~/.config/loopherd/herds/loopherd-cards.toml, and copy
# loopherd-cards-lead.md beside it. Start the lead with
# `loopherd lead loopherd-cards --dry-run`, then without --dry-run.
#
# Also add this line to the herd's existing [template.card], so the lead's
# watch wakes when a worker's PR merges:
# merged = "GH_TOKEN=$(gh auth token --user <gh-user>) gh pr list --head {branch} --state merged --json number --jq length | grep -qx 1"
#
# And this line at the top of the herd file, above its first table, so feed
# runs the routine after-merge steps once per merged member (D28). Feed run
# from the lead's pane runs none of it while `install` below is off:
# after_merge = ["git pull --ff-only", "scripts/install --no-extras", "scripts/trello unblock"]
#
# With a [queue] backlog (see loopherd-cards-routed.toml), the lead's watch
# wakes it with `loopherd-cards running low` and it reports its triage as a
# question (D60). It never marks a card ready, save a review follow-up filed
# under follow_ups_ready below; once the human approves, the
# shepherd runs, per docs/agents/shepherd.md's Triage:
#   scripts/trello label LH-<n> +ready-for-agent      # each ready card
#   scripts/trello comment LH-<n> "<what's missing>"  # each needs-spec card
#   scripts/trello archive LH-<n>                     # each stale card the human confirms
[lead]
prompt_file = "loopherd-cards-lead.md"
# args defaults to the herd's args. Every switch is off until the human turns it on.
merge = false
install = false
rebase = false
new_cards = false
design_escalation = false
blocked_dialogs = false
# With new_cards on too, file a review follow-up that qualifies under D116
# as ready-for-agent and blocked on its parent card, and say so in a note.
follow_ups_ready = false
# How many review rounds the lead runs on a PR before asking the human;
# unset, it comes from config.toml's [lead_defaults], else 3.
# review_rounds = 3
# The checks `loopherd gate <sha>` runs in the lead's broker, outside its
# sandbox, on a PR's head merged with main (D149).
gate = ["cargo fmt --check", "cargo clippy --all-targets -- -D warnings", "cargo test"]
