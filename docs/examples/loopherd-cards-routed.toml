# A queue that routes each card to one of three templates: the herd's existing
# `card` for impl cards, `wayfinding` (on sonnet, its own prompt) for
# research, domain and prototype cards, and `grill-batch` for grilling cards
# labelled `grill:batch` (D132). Replace the herd's `[queue]` with this one,
# and add `[template.wayfinding]`, `[template.grill-batch]` and
# `[template.groom]` beside its `[template.card]`, whose params must stay
# ["card", "type", "slug"]. `grill-batch` reads
# docs/agents/grill-batch-prompt.md through the docs/ link described in
# loopherd-cards-grill.toml.
#
# With `templates`, the first word of each line `source` prints names the
# task's template (one of the list) and the rest are its params. A line whose
# first word isn't in the list is a bad line. One `max` covers every template.
# A member's identity is its rendered name, so a task re-routed to another
# template while its first member is open gets a second member.
[queue]
templates = ["card", "wayfinding", "grill-batch"]
# Prints "card <n> <type> <slug>", "wayfinding <n> docs <slug>" or
# "grill-batch <n> docs <slug>" per claimable card, in board order.
# impl:<type> cards get <type>; wayfinding cards get docs. A grilling card
# never carries ready-for-agent, so a `grill:batch` one is claimable without
# it; any other grilling needs the human live.
source = '''
scripts/trello cards --list Backlog | awk -F'\t' '
  $3 ~ /(^|,)(need-human|blocked)(,|$)/ { next }
  {
    if ($3 ~ /wayfinding:grilling/ && $3 ~ /(^|,)grill:batch(,|$)/) template = "grill-batch"
    else if ($3 ~ /wayfinding:grilling/ || $3 !~ /(^|,)ready-for-agent(,|$)/) next
    else if (match($3, /impl:[a-z]+/)) template = "card"
    else if ($3 ~ /wayfinding:/) template = "wayfinding"
    else next
    type = template == "card" ? substr($3, RSTART + 5, RLENGTH - 5) : "docs"
    slug = tolower($4); gsub(/[^a-z0-9]+/, "-", slug); gsub(/^-|-$/, "", slug)
    n = split(slug, w, "-"); slug = w[1]
    for (i = 2; i <= n && i <= 5; i++) slug = slug "-" w[i]
    sub(/^LH-/, "", $1); print template, $1, type, slug
  }'
'''
# Prints "<key> <title>" per Backlog card that isn't blocked and either
# lacks ready-for-agent or has need-human or wayfinding:grilling, leaving out
# a `grill:batch` grilling card `source` lists. A ready-for-agent card with
# neither an impl:* nor a wayfinding:* label is in neither this nor `source`.
# `loopherd status` counts this list's lines as unready.
backlog = '''
scripts/trello cards --list Backlog | awk -F'\t' '
  $3 ~ /(^|,)blocked(,|$)/ { next }
  $3 ~ /(^|,)need-human(,|$)/ { print $1, $4; next }
  $3 ~ /wayfinding:grilling/ && $3 ~ /(^|,)grill:batch(,|$)/ { next }
  $3 ~ /(^|,)ready-for-agent(,|$)/ && $3 !~ /wayfinding:grilling/ { next }
  { print $1, $4 }'
'''
max = 3
# A lead's watch says `running low` at or below this many claimable cards
# while `backlog` lists any. Default 2 × max; less than max is an error.
# low_at = 6

[template.wayfinding]
params = ["card", "type", "slug"]
name = "research-{card}"
branch = "{type}/LH-{card}-{slug}"
args = ["--model", "sonnet"]
done = "scripts/trello show LH-{card} | grep -qx 'list: Done'"
merged = "GH_TOKEN=$(gh auth token --user <gh-user>) gh pr list --head {branch} --state merged --json number --jq length | grep -qx 1"
prompt = """
You're {name}, working on branch {branch} in {worktree}.

Work Trello card LH-{card} per AGENTS.md and docs/agents/issue-tracker.md: read the card and every
comment with `scripts/trello show LH-{card}`, claim it (move to In Progress, comment "claimed by {name}"),
and resolve it with the skill its kind label names. Wayfinding output goes on this branch.

Push as <gh-user>: `GH_TOKEN=$(gh auth token --user <gh-user>) git -c credential.helper= -c credential.helper='!gh auth git-credential' push ...`.
Open the PR with --assignee @me, title `docs(LH-{card}): ...`, card URL as the first line. Comment the PR
link and a three-line summary on the card and move it to Review. Never rebase or force-push.

If you hit a question only the human can answer, stop cleanly as the card workflow describes.
Finish every stop with one report: `loopherd report --kind done "<PR link and summary>"`, or
`--kind question "<the exact question>"`.
"""

# A batch grill (D132): an ordinary member, holding a slot only while it
# runs. It posts its whole batch on the card, adds need-human, moves the card
# to Backlog and stops; `done` then passes, so feed reaps it. Once the human
# answers on the card, the shepherd drops need-human and runs
# `loopherd release grill-batch-<n>`, and feed starts a fresh member, which
# reads the answer and writes the decision.
[template.grill-batch]
params = ["card", "type", "slug"]
name = "grill-batch-{card}"
branch = "{type}/LH-{card}-{slug}"
done = "s=$(scripts/trello show LH-{card} | head -4); echo \"$s\" | grep -qx 'list: Done' || (echo \"$s\" | grep -qx 'list: Backlog' && echo \"$s\" | grep -q '^labels: .*need-human')"
merged = "GH_TOKEN=$(gh auth token --user <gh-user>) gh pr list --head {branch} --state merged --json number --jq length | grep -qx 1"
prompt_file = "docs/agents/grill-batch-prompt.md"

# The groomer (D116): started on `running low` by the lead (or the shepherd
# for an unled herd) with `loopherd add <herd> groom`, never by feed, so it
# stays out of `[queue] templates`. It holds no slot and has no done or merged
# check; the lead retires it with --close after relaying its report.
[template.groom]
params = []
name = "groom-{herd}"
worktree = "groom-{herd}"
slot = false
args = ["--model", "sonnet"]
prompt = """
You're {name}, in a detached worktree at {worktree}, grooming the {herd} herd's unready cards.

Run `loopherd --skill --section groom` and follow it: it gives your rights, your limits and the
report to send. Read docs/agents/issue-tracker.md and AGENTS.md first. List the unready cards by
running the shell command held in the TOML string `loopherd herd get {herd} queue.backlog` prints
(the text inside its quotes, not the output as is), and read each with
`scripts/trello show LH-<n>`.
Edit a card's description with `scripts/trello desc LH-<n> -`, its whole new text on stdin
through a quoted heredoc.

Write each batch line's command in one of these forms, text escaped as the Groom section says:
- mark ready: `scripts/trello label LH-<n> +ready-for-agent`
- needs spec: `scripts/trello comment LH-<n> "<what's missing>"`
- archive: `scripts/trello archive LH-<n>  # <reason>`

Never add ready-for-agent, archive, move a card between lists, or touch need-human or blocked.
Finish with one report in the Groom section's format, sent through a quoted heredoc:
loopherd report --kind done "$(cat <<'EOF'
<report>
EOF
)"
"""
