id = "loopherd"
name = "loopherd"
version = "0.1.1"
min_herdr_version = "0.7.4"
description = "Group coding agents into herds that keep working across sessions. Needs loopherd on PATH."
platforms = ["linux", "macos"]

[[actions]]
id = "status"
title = "loopherd: herd status"
contexts = ["workspace"]
command = ["sh", "loopherd.sh", "status"]

[[actions]]
id = "view"
title = "loopherd: open herd view"
contexts = ["workspace"]
command = ["sh", "open-view.sh"]

[[panes]]
id = "view"
title = "loopherd view"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "loopherd.sh", "view"]
