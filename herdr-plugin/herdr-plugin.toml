id = "loopherd"
name = "loopherd"
version = "0.2.2"
min_herdr_version = "0.7.5"
description = "Group coding agents into herds that keep working across sessions. Needs loopherd on PATH."
platforms = ["linux", "macos"]

# Starts alive leads' brokers; only config.toml's [herdr_plugin]
# revive_on_startup = true also resumes members and prompts leads.
[[startup]]
command = ["sh", "loopherd.sh", "revive", "--startup"]

[[actions]]
id = "status"
title = "loopherd: herd status"
contexts = ["workspace"]
command = ["sh", "loopherd.sh", "status"]

[[actions]]
id = "view"
title = "loopherd: open herd view"
contexts = ["workspace"]
command = ["sh", "open-view.sh"]

# Splits the view beside the shepherd's pane, else the current one, on the
# side config.toml's view.layout picks.
[[actions]]
id = "view-beside-shepherd"
title = "loopherd: open view beside shepherd"
contexts = ["workspace"]
command = ["sh", "loopherd.sh", "view", "--beside-shepherd"]

[[panes]]
id = "view"
title = "loopherd view"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "loopherd.sh", "view"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "loopherd.sh", "herdr-event-hook"]

[[events]]
on = "pane.exited"
command = ["sh", "loopherd.sh", "herdr-event-hook"]

[[events]]
on = "pane.closed"
command = ["sh", "loopherd.sh", "herdr-event-hook"]

[[events]]
on = "tab.closed"
command = ["sh", "loopherd.sh", "herdr-event-hook"]

[[events]]
on = "workspace.closed"
command = ["sh", "loopherd.sh", "herdr-event-hook"]

[[events]]
on = "pane.moved"
command = ["sh", "loopherd.sh", "herdr-event-hook"]

# Needs herdr's ui.mouse_capture on; without it the terminal handles the click.
[[link_handlers]]
id = "github-pr"
title = "loopherd: PR's member"
pattern = "^https://github\\.com/[^/]+/[^/]+/pull/[0-9]+"
action = "pr-member"

[[actions]]
id = "pr-member"
title = "loopherd: PR's member"
command = ["sh", "loopherd.sh", "pr"]

[[panes]]
id = "pr-member"
title = "loopherd: PR's member"
placement = "popup"
width = "80%"
height = 20
command = ["sh", "loopherd.sh", "pr", "--popup"]
