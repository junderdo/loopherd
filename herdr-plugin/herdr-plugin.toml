id = "loopherd"
name = "loopherd"
version = "0.1.1"
min_herdr_version = "0.7.5"
description = "Group coding agents into herds that keep working across sessions. Needs loopherd on PATH."
platforms = ["linux", "macos"]

# Does nothing unless config.toml sets [herdr_plugin] revive_on_startup = true.
[[startup]]
command = ["sh", "loopherd.sh", "revive", "--startup"]

[[actions]]
id = "status"
title = "loopherd: herd status"
contexts = ["workspace"]
command = ["sh", "loopherd.sh", "status"]

[[actions]]
id = "view"
title = "loopherd: open herd view"
contexts = ["workspace"]
command = ["sh", "open-view.sh"]

[[panes]]
id = "view"
title = "loopherd view"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "loopherd.sh", "view"]

# Needs herdr's ui.mouse_capture on; without it the terminal handles the click.
[[link_handlers]]
id = "github-pr"
title = "loopherd: PR's member"
pattern = "^https://github\\.com/[^/]+/[^/]+/pull/[0-9]+"
action = "pr-member"

[[actions]]
id = "pr-member"
title = "loopherd: PR's member"
command = ["sh", "loopherd.sh", "pr"]

[[panes]]
id = "pr-member"
title = "loopherd: PR's member"
placement = "popup"
width = "80%"
height = 20
command = ["sh", "loopherd.sh", "pr", "--popup"]
