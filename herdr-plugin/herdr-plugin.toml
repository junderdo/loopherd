id = "loopherd"
name = "loopherd"
version = "0.1.1"
min_herdr_version = "0.7.0"
description = "Group coding agents into herds that keep working across sessions. Needs loopherd on PATH."
platforms = ["linux", "macos"]

[[actions]]
id = "status"
title = "loopherd: herd status"
contexts = ["workspace"]
command = ["sh", "loopherd.sh", "status"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "loopherd.sh", "herdr-event-hook"]

[[events]]
on = "pane.exited"
command = ["sh", "loopherd.sh", "herdr-event-hook"]

[[events]]
on = "pane.closed"
command = ["sh", "loopherd.sh", "herdr-event-hook"]
